org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# JDK 21 (LTS). Gradle 9 / AGP 8.11 don't yet handle the JDK 26 class-file
# format, so the project pins its toolchain explicitly. Auto-detect picks
# up a locally installed JDK 21 (Homebrew openjdk@21, Adoptium, asdf, …);
# auto-download fetches one via the Foojay resolver if no local one is found.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
