org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# JDK 21 (LTS). Gradle 9 / AGP 8.11 don't yet handle the JDK 26 class-file
# format, so the project pins its toolchain explicitly. Auto-detect picks
# up a locally installed JDK 21 (Homebrew openjdk@21, Adoptium, etc.);
# auto-download fetches one through the Foojay resolver if missing.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Force the Gradle daemon itself onto JDK 21. The toolchain spec above only
# controls compile JDK; the daemon parsing this script must also run on a
# version Gradle 9 supports. This path is the Homebrew default on Apple
# Silicon; override in `~/.gradle/gradle.properties` if your JDK lives
# elsewhere (Adoptium, asdf, jenv, CI runner, etc.).
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

