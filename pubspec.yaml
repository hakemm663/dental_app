name: docdoc
description: "DocDoc — doctor appointment booking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.4
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.8
  firebase_auth: ^5.5.4
  firebase_storage: ^12.4.4
  cloud_functions: ^5.2.0
  firebase_app_check: ^0.3.2+10
  camera: ^0.11.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  permission_handler: ^11.4.0
  agora_rtc_engine: ^6.5.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  firebase_crashlytics: ^4.3.10
  supabase_flutter: ^2.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/
    - assets/icons/

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/icons/docdoc_app_icon.png
  image_dark: assets/icons/docdoc_app_icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/icons/docdoc_app_icon.png
    image_dark: assets/icons/docdoc_app_icon.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#FFFFFF"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/docdoc_app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/docdoc_app_icon.png"
