name: Flutter CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed lib
      - name: Static analysis
        run: flutter analyze

  android-staging:
    name: Build Android staging APK
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build staging APK
        run: flutter build apk --flavor staging -t lib/main_staging.dart --dart-define-from-file=env/staging.json
      - uses: actions/upload-artifact@v4
        with:
          name: docdoc-staging-apk
          path: build/app/outputs/flutter-apk/app-staging-release.apk
          retention-days: 7
