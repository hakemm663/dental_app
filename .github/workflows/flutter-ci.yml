name: Android Fastlane with Firebase App Distribution Workflow

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  # Manual trigger for the distribute job. Used to verify the Firebase
  # upload from a feature branch BEFORE merging to development.
  # GitHub → Actions → this workflow → "Run workflow".
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout my repo code
        uses: actions/checkout@v4
      - name: install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --set-exit-if-changed lib
      - name: Static analysis
        run: flutter analyze

  distribute_to_firebase:
    name: Distribute production to Firebase App Distribution
    # Run on (a) merges/pushes to development OR (b) manual dispatch from
    # any branch. PR-trigger paths are intentionally excluded so random
    # PR-branch builds don't get shipped to testers.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/development')
      || github.event_name == 'workflow_dispatch'
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Fastlane derives release notes from the last commit — need full
          # history rather than the shallow default.
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'
          bundler-cache: true
          working-directory: android
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Build and Distribute App
        env:
         FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
        run: |
          bundle exec fastlane android firebase_distribution
        working-directory: android
